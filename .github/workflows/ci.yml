name: Frontend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=high

      - name: Lint Code
        run: pnpm lint

      - name: TypeScript Typecheck
        run: pnpm tsc --noEmit

      - name: Build Application
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.staging.loicbonin.com/api/v1
